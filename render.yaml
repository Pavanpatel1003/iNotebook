services:
  - type: web
    name: inotebook-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TOKEN_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: note-attachments
